<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<sc-if value="{{ isIdle }}" hint-placeholder-val="{{ true }}"><button onClick="{{ tap }}" style="width:100%;height:100%;min-height:56px;display:flex;align-items:center;gap:12px;padding:12px 14px;background:#FFFDF7;border:1px solid #D8D1C6;border-radius:12px;text-align:left;color:#171A1F;cursor:pointer;box-sizing:border-box;font-family:'Public Sans',sans-serif;transition:border-color 120ms,background 120ms" style-hover="border-color:#62656A;background:#FFFFFF"><span style="flex:none;width:28px;height:28px;border-radius:50%;border:1px solid #D8D1C6;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:#62656A">{{ letter }}</span><span style="flex:1;min-width:0;font-size:16px;line-height:1.35;text-wrap:pretty">{{ label }}</span></button></sc-if>
<sc-if value="{{ isPressed }}" hint-placeholder-val="{{ false }}"><div style="width:100%;height:100%;min-height:56px;display:flex;align-items:center;gap:12px;padding:11.5px 13.5px;background:#F1ECE2;border:1.5px solid #171A1F;border-radius:12px;color:#171A1F;box-sizing:border-box;font-family:'Public Sans',sans-serif"><span style="flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid #171A1F;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600">{{ letter }}</span><span style="flex:1;min-width:0;font-size:16px;line-height:1.35;text-wrap:pretty">{{ label }}</span></div></sc-if>
<sc-if value="{{ isCorrect }}" hint-placeholder-val="{{ false }}"><div style="width:100%;height:100%;min-height:56px;display:flex;align-items:center;gap:12px;padding:11px 13px;background:#EAF0F6;border:2px solid #2F5F8F;border-radius:12px;color:#171A1F;box-sizing:border-box;font-family:'Public Sans',sans-serif"><span style="flex:none;width:28px;height:28px;border-radius:50%;background:#2F5F8F;display:flex;align-items:center;justify-content:center;color:#FFFDF7"><span class="material-symbols-outlined" style="font-size:18px;font-weight:600">check</span></span><span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px"><span style="font-size:16px;line-height:1.35;font-weight:600;text-wrap:pretty">{{ label }}</span><sc-if value="{{ hasTag }}" hint-placeholder-val="{{ false }}"><span style="font-size:13px;line-height:1.35;color:#2F5F8F;font-weight:600">{{ tag }}<sc-if value="{{ hasNote }}" hint-placeholder-val="{{ false }}"><span style="font-weight:400;color:#62656A"> · {{ note }}</span></sc-if></span></sc-if></span></div></sc-if>
<sc-if value="{{ isWrong }}" hint-placeholder-val="{{ false }}"><div style="width:100%;height:100%;min-height:56px;display:flex;align-items:center;gap:12px;padding:11px 13px;background:#F5ECE3;border:2px solid #A66A3F;border-radius:12px;color:#171A1F;box-sizing:border-box;font-family:'Public Sans',sans-serif"><span style="flex:none;width:28px;height:28px;border-radius:50%;background:#A66A3F;display:flex;align-items:center;justify-content:center;color:#FFFDF7"><span class="material-symbols-outlined" style="font-size:18px;font-weight:600">close</span></span><span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px"><span style="font-size:16px;line-height:1.35;text-wrap:pretty">{{ label }}</span><sc-if value="{{ hasTag }}" hint-placeholder-val="{{ false }}"><span style="font-size:13px;line-height:1.35;color:#7E4E2C;font-weight:600">{{ tag }}</span></sc-if></span></div></sc-if>
<sc-if value="{{ isDim }}" hint-placeholder-val="{{ false }}"><div style="width:100%;height:100%;min-height:56px;display:flex;align-items:center;gap:12px;padding:12px 14px;background:transparent;border:1px solid #E3DCD0;border-radius:12px;color:#62656A;box-sizing:border-box;font-family:'Public Sans',sans-serif"><span style="flex:none;width:28px;height:28px;border-radius:50%;border:1px solid #E3DCD0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600">{{ letter }}</span><span style="flex:1;min-width:0;font-size:16px;line-height:1.35;text-wrap:pretty">{{ label }}</span></div></sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:350,&quot;height&quot;:80},&quot;letter&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;B&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;label&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Bosworth Field&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;state&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;idle&quot;,&quot;pressed&quot;,&quot;correct&quot;,&quot;wrong&quot;,&quot;dim&quot;],&quot;default&quot;:&quot;idle&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;tag&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;note&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;onTap&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const s = this.props.state || 'idle';
    return {
      isIdle: s === 'idle', isPressed: s === 'pressed', isCorrect: s === 'correct', isWrong: s === 'wrong', isDim: s === 'dim',
      hasTag: !!this.props.tag, hasNote: !!this.props.note,
      tap: () => this.props.onTap && this.props.onTap()
    };
  }
}
</script>
</body>
</html>
