<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="display:flex;gap:10px;position:relative;font-family:'Public Sans',sans-serif;color:#171A1F">
<div style="flex:none;width:32px;position:relative">
<sc-if value="{{ lineTop }}" hint-placeholder-val="{{ true }}"><div style="position:absolute;left:15px;top:0;height:28px;width:2px;background:#D8D1C6"></div></sc-if>
<sc-if value="{{ lineBottom }}" hint-placeholder-val="{{ true }}"><div style="position:absolute;left:15px;top:28px;bottom:0;width:2px;background:#D8D1C6"></div></sc-if>
<sc-if value="{{ isIdle }}" hint-placeholder-val="{{ true }}"><div style="position:absolute;top:12px;left:0;width:32px;height:32px;border-radius:50%;background:#F7F3EA;border:1.5px solid #D8D1C6;box-sizing:border-box;display:flex;align-items:center;justify-content:center;font:600 15px 'Source Serif 4',serif">{{ pos }}</div></sc-if>
<sc-if value="{{ isLifted }}" hint-placeholder-val="{{ false }}"><div style="position:absolute;top:12px;left:0;width:32px;height:32px;border-radius:50%;background:#171A1F;color:#FFFDF7;display:flex;align-items:center;justify-content:center;font:600 15px 'Source Serif 4',serif">{{ pos }}</div></sc-if>
<sc-if value="{{ isRight }}" hint-placeholder-val="{{ false }}"><div style="position:absolute;top:12px;left:0;width:32px;height:32px;border-radius:50%;background:#2F5F8F;color:#FFFDF7;display:flex;align-items:center;justify-content:center"><span class="material-symbols-outlined" style="font-size:18px;font-weight:600">check</span></div></sc-if>
<sc-if value="{{ isWrong }}" hint-placeholder-val="{{ false }}"><div style="position:absolute;top:12px;left:0;width:32px;height:32px;border-radius:50%;background:#F7F3EA;border:2px solid #A66A3F;box-sizing:border-box;color:#7E4E2C;display:flex;align-items:center;justify-content:center"><span class="material-symbols-outlined" style="font-size:18px;font-weight:600">close</span></div></sc-if>
</div>
<div style="flex:1;min-width:0;padding-bottom:8px">
<sc-if value="{{ isIdle }}" hint-placeholder-val="{{ true }}"><div style="min-height:56px;display:flex;align-items:center;gap:4px;padding:4px 2px 4px 8px;background:#FFFDF7;border:1px solid #D8D1C6;border-radius:12px;box-sizing:border-box;cursor:grab"><span class="material-symbols-outlined" style="font-size:20px;color:#62656A;flex:none">drag_indicator</span><span style="flex:1;min-width:0;font-size:15px;line-height:1.35;padding:6px 4px;text-wrap:pretty">{{ label }}</span><button onClick="{{ up }}" disabled="{{ upDisabled }}" aria-label="Move up" style="flex:none;width:40px;height:48px;border:0;background:none;display:flex;align-items:center;justify-content:center;color:#171A1F;cursor:pointer;opacity:{{ upOpacity }}"><span class="material-symbols-outlined" style="font-size:22px">arrow_upward</span></button><button onClick="{{ down }}" disabled="{{ downDisabled }}" aria-label="Move down" style="flex:none;width:40px;height:48px;border:0;background:none;display:flex;align-items:center;justify-content:center;color:#171A1F;cursor:pointer;opacity:{{ downOpacity }}"><span class="material-symbols-outlined" style="font-size:22px">arrow_downward</span></button></div></sc-if>
<sc-if value="{{ isLifted }}" hint-placeholder-val="{{ false }}"><div style="min-height:56px;display:flex;align-items:center;gap:4px;padding:4px 2px 4px 8px;background:#FFFDF7;border:1.5px solid #171A1F;border-radius:12px;box-sizing:border-box;box-shadow:0 10px 24px rgba(23,26,31,.14);transform:translateY(-2px) scale(1.01)"><span class="material-symbols-outlined" style="font-size:20px;color:#171A1F;flex:none">drag_indicator</span><span style="flex:1;min-width:0;font-size:15px;line-height:1.35;padding:6px 4px;text-wrap:pretty">{{ label }}</span><span style="flex:none;width:80px"></span></div></sc-if>
<sc-if value="{{ isRight }}" hint-placeholder-val="{{ false }}"><div style="min-height:56px;display:flex;flex-direction:column;justify-content:center;gap:2px;padding:9px 13px;background:#EAF0F6;border:1.5px solid #2F5F8F;border-radius:12px;box-sizing:border-box"><div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px"><span style="font:600 17px/1.2 'Source Serif 4',serif;color:#2F5F8F">{{ year }}</span><span style="font-size:12px;font-weight:600;color:#2F5F8F">In place</span></div><span style="font-size:15px;line-height:1.35;text-wrap:pretty">{{ label }}</span></div></sc-if>
<sc-if value="{{ isWrong }}" hint-placeholder-val="{{ false }}"><div style="min-height:56px;display:flex;flex-direction:column;justify-content:center;gap:2px;padding:9px 13px;background:#FFFDF7;border:1.5px solid #A66A3F;border-radius:12px;box-sizing:border-box"><div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px"><span style="font:600 17px/1.2 'Source Serif 4',serif;color:#2F5F8F">{{ year }}</span><span style="font-size:12px;font-weight:600;color:#7E4E2C">{{ hint }}</span></div><span style="font-size:15px;line-height:1.35;text-wrap:pretty">{{ label }}</span></div></sc-if>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:350,&quot;height&quot;:80},&quot;pos&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:1,&quot;tsType&quot;:&quot;number&quot;},&quot;label&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Morse receives a telegraph patent&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;year&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;1840&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;state&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;idle&quot;,&quot;lifted&quot;,&quot;right&quot;,&quot;wrong&quot;],&quot;default&quot;:&quot;idle&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;hint&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;first&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;last&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;onUp&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;},&quot;onDown&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props, s = p.state || 'idle';
    const first = p.first === true || p.first === 'true', last = p.last === true || p.last === 'true';
    return {
      isIdle: s === 'idle', isLifted: s === 'lifted', isRight: s === 'right', isWrong: s === 'wrong',
      lineTop: !first, lineBottom: !last,
      upDisabled: first, downDisabled: last, upOpacity: first ? 0.3 : 1, downOpacity: last ? 0.3 : 1,
      up: () => p.onUp && p.onUp(), down: () => p.onDown && p.onDown()
    };
  }
}
</script>
</body>
</html>
